services:
  research-agent:
    build: .
    image: research-agent:1.0.0
    ports:
      - "8030:8030"
    environment:
      # Nothing secret is baked into the image. Without a key the service still
      # runs - every project in this series works offline.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      HOST: "0.0.0.0"
      PORT: "8030"
    env_file:
      - path: .env
        required: false
    volumes:
      # State outlives the container; source does not go in.
      - research-agent-data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  research-agent-data:
