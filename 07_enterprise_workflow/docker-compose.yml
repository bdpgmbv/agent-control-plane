services:
  enterprise-workflow:
    build: .
    image: enterprise-workflow:1.0.0
    ports:
      - "8070:8070"
    environment:
      # Nothing secret is baked into the image. Without a key the service still
      # runs - every project in this series works offline.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      HOST: "0.0.0.0"
      PORT: "8070"
    env_file:
      - path: .env
        required: false
    volumes:
      # State outlives the container; source does not go in.
      - enterprise-workflow-data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  enterprise-workflow-data:
