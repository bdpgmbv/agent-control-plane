# The configuration the sandboxed test run uses, and the only one.
#
# It lives here, inside the harness, rather than in the workspace, for two
# reasons. The agent cannot edit it, because it is outside the sandbox. And
# passing it explicitly with -c stops pytest discovering any OTHER config by
# walking up the directory tree.
#
# That second reason is not hypothetical. Workspaces are created inside this
# project, so pytest walked up from a workspace and found the project's own
# pytest.ini - the one for the harness's test suite - and applied its
# `addopts = -q`. That suppressed the per-test output the parser reads, so every
# sandboxed run came back as "0 passed, 0 failed" and every task was rejected
# for a target test that "did not run at all". The tests were running fine; the
# harness had stopped being able to see them.
[pytest]
addopts =
